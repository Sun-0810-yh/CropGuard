; ============================================================
; CropGuard 农智云 · ESP32 硬件执行闭环（PlatformIO 工程）
; ------------------------------------------------------------
; 板型   : ESP32-WROOM-32 / "ESP32 Dev Module"（board = esp32dev）
; 框架   : Arduino（WebServer / esp_now 随核心自带，无需 lib_deps）
; 平台   : 钉死 espressif32@7.1.3 —— 对应 Arduino 核心 2.0.17，
;          其 ESP-NOW 回调是 v1 签名，与 feedback/ 下已验证的 .ino 一致。
;          核心 3.x 会改签名，代码里已用 ESP_ARDUINO_VERSION 双分支兜底，
;          但仍不要随手上抬版本号。
;
; env 一览（VSCode 左下角 PlatformIO 图标 → Project Tasks 里切换）：
;   http_node_g1 / http_node_g2  方案甲 HTTP 喷洒节点（主路线，片区A/B）
;   alarm                        声光报警器，接 configs.yaml 的 FEEDBACK.serial_port
;   espnow_node_g1 / _g2         方案丙 ESP-NOW 喷洒节点（备用）
;   espnow_gateway               方案丙 USB 串口网关（备用 / 降级路线）
;   wifi_gateway                 方案丙无线网关（备用，需 AP 能锁信道 1）
;   selftest                     板载协议自检（无需外设，验完换回业务 env）
;
; 详细说明、接线与排错见同目录 README.md
; ============================================================

[platformio]
default_envs = http_node_g1
; 8 个 env 共用编译缓存：Arduino 核心/ESP-IDF 的目标文件只编一次，
; 各 env 只有 build_flags 不同（-DNODE_ID 等），受影响的重编，其余直接复用。
build_cache_dir = .pio/build_cache

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; upload_port / monitor_port 留空：由 VSCode 自动探测当前 COM 口

; ---------------- 方案甲：HTTP 喷洒节点（主路线） ----------------
; 身份由 -DNODE_ID 单点推导（分组 g1/g2、显示名、静态 IP 末位），见 include/cg_config.h。
; 这里刻意只放数字，不带引号、不带中文，避免 platformio.ini 的转义与编码坑。
[env:http_node_g1]
build_src_filter = +<common/> +<http_node/>
; MAX_SPRAY_SEC=5：负载是 5V 超声雾化片（怕干烧），单次硬上限收到 5 秒
; 极性已确认低电平触发，与 cg_config.h 默认 RELAY_ACTIVE=LOW 一致，无需额外 -D
; USE_DHCP=1：热点网段不确定（手机热点"共享已连接 WiFi"会把上游校园网地址发下来），
;             让它自动取地址；网段确定时改 0 并用 -DNODE_IP_LAST 指定静态 IP
build_flags = -DNODE_ID=1 -DMAX_SPRAY_SEC=5 -DUSE_DHCP=1

[env:http_node_g2]
build_src_filter = +<common/> +<http_node/>
build_flags = -DNODE_ID=2 -DMAX_SPRAY_SEC=5 -DUSE_DHCP=1

; ---------------- 声光报警器（9600，单字符 'R' / 'Y' / 'G'） ----------------
[env:alarm]
build_src_filter = +<common/> +<alarm/>
monitor_speed = 9600          ; 必须与 configs.yaml 的 FEEDBACK.baud 一致

; ---------------- 方案丙：ESP-NOW 节点 / 网关（备用） ----------------
[env:espnow_node_g1]
build_src_filter = +<common/> +<espnow_node/>
build_flags = -DNODE_ID=1 -DMAX_SPRAY_SEC=5

[env:espnow_node_g2]
build_src_filter = +<common/> +<espnow_node/>
build_flags = -DNODE_ID=2 -DMAX_SPRAY_SEC=5

[env:espnow_gateway]
build_src_filter = +<common/> +<espnow_gateway/>

[env:wifi_gateway]
build_src_filter = +<common/> +<wifi_gateway/>

; ---------------- 板载协议自检（无需继电器 / 水泵） ----------------
[env:selftest]
build_src_filter = +<common/> +<selftest/>

; ---------------- 继电器接线自检（不依赖 WiFi，上电就 2 秒一次吸合/断开） ----------------
; 接线确认用：pio run -e relaytest -t upload
[env:relaytest]
build_src_filter = +<common/> +<relaytest/>
