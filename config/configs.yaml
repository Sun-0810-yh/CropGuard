# 信号反馈配置
FEEDBACK:
  # 是否启用反馈（语音播报 + 声光报警）
  enabled: true
  # Arduino 串口号（Windows 如 'COM3'），无 Arduino 时设为 null，仅用语音播报
  serial_port: null
  # 串口波特率
  baud: 9600
  # 语音播报最小间隔（秒），避免连续检测时过于嘈杂
  speak_interval: 3

# 喷淋执行配置（ESP-NOW 网关 + 喷头节点，国赛形态C 物理执行闭环）
SPRAY:
  # 是否启用喷淋联动（识别到中/高风险后自动喷淋）
  enabled: true
  # 网关 USB 串口号（Windows 如 'COM4'）；无网关时设为 null，仅推理不做喷淋
  serial_port: null
  # 网关串口波特率（需与 feedback/spray_executor/gateway.ino 的 Serial.begin 一致）
  baud: 115200
  # 指令传输方式（国赛"田间无线"改造）：
  #   'serial' : Server --USB串口--> 网关ESP32 --ESP-NOW--> 节点（现状，含一根 USB 线）
  #   'http'   : Server --HTTP--> 目标设备（方案甲：节点直连 WiFi；方案丙：无线网关转发）
  #   'mqtt'   : Server --MQTT--> 目标设备（方案乙，需 broker）
  transport: 'serial'
  # transport='http' 时的目标地址表（group -> 设备地址）
  #   方案甲（节点直连，故障隔离好）：每个分组各配一个地址
  #   方案丙（无线网关，节点固件零改动·推荐）：只配一项 group='gateway'，全部指令发网关，由网关 ESP-NOW 转发
  http_targets: []
  # 示例：
  # http_targets:
  #   - { group: 'g1', url: 'http://192.168.4.61/spray' }
  #   - { group: 'g2', url: 'http://192.168.4.62/spray' }
  # 方案丙示例（推荐）：
  # http_targets:
  #   - { group: 'gateway', url: 'http://192.168.4.60/spray' }
  http_timeout: 1.0
  # transport='mqtt' 时的 broker 配置
  mqtt:
    host: ''            # 例：'192.168.4.100'
    port: 1883
    topic: 'cropguard/spray'
    qos: 0
  # 两次自动喷淋最小间隔（秒），避免连续推理反复喷
  min_interval: 3
  # 风险等级 -> 喷淋分组与时长（秒）映射；duration<=0 或 group 为空表示不喷
  # 协议：Server -> 网关串口发 {"group":"all","duration":3}，网关 ESP-NOW 广播，
  #       节点按自身 group 过滤执行（继电器闭合 -> 水泵喷 -> 断开）
  risk_map:
    '高风险': { group: 'all', duration: 3 }
    '中风险': { group: 'g1', duration: 2 }
    # 低风险默认不喷；如需现场演示可改为 { group: 'g2', duration: 1 }
    '低风险': { group: null, duration: 0 }
    '无风险': { group: null, duration: 0 }
  # 喷头节点登记表（烧录时写入节点 NODE_ID/NODE_GROUP；网关可选单播用 MAC）
  # 国赛 2 片区版：片区A = g1(id=1)、片区B = g2(id=2)，每片区 1 个喷洒节点
  # 扩展多节点：按同样格式追加 id/group/name/mac 即可（group 相同的节点会一起被喷）
  nodes:
    - { id: 1, group: 'g1', name: '片区A', mac: 'AA:BB:CC:DD:EE:01' }
    - { id: 2, group: 'g2', name: '片区B', mac: 'AA:BB:CC:DD:EE:02' }
