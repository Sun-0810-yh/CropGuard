# 模型相关的配置文件
MODEL:
  # 模型文件
  WEIGHT: './runs/train/pest27_final4/weights/best.pt'
  # 取值 'cpu'、'cuda:0'、'0'、 '1'、 '2'等 cpu代表以cpu进行推理，0代表使用第0块显卡
  DEVICE: 'cuda:0'
  # 阈值
  CONF: 0.4
  # 过滤类别
  CLASSES: None
  # 图片大小
  IMGSIZE: 640

# 输出配置
OUTPUT:
  # 输出根目录
  base_dir: './output'
  # 是否使用时间戳创建子目录
  use_timestamp: true
  # 自定义目录名 (当use_timestamp为false时使用)
  custom_dir: 'pest_detection_results'
  # 支持的保存格式
  save_formats: ['txt', 'csv', 'json', 'excel']


UI:
  # 背景图片
  background: './icon/background.jpg'
  # 主图
  zhutu2: './icon/zhutu2.png'
  # 最上方的名称
  title: '农作物害虫智能检测识别与大模型防控决策系统'
  # 名称
  label_title: '农作物害虫智能检测识别与大模型防控决策系统'
  # 开始识别按钮背景颜色
  start_button_bg: "48,77,49"
  # 开始识别按钮字体颜色
  start_button_font: "255,255,255"
  # 导出数据按钮颜色
  export_button_bg: "48,77,49"
  # 导出数据按钮字体颜色
  export_button_font: "255,255,255"
  # 图片填充 RGB格式
  padvalue: [ 167,200,171 ]
  # 表格每列的宽度
  column_widths: [ 50, 220, 120, 200, 80, 80, 140 ]
  # 表格中字体的颜色 RGB格式
  column_color: [ 0, 0, 0 ]
  # 个人信息
  label_info_txt: "作者: Stara-AI"
  # 个人信息字体颜色 RGB 格式
  label_info_color: "0, 0, 0"
  # 左侧控制区域颜色 RGBA
  label_control_color: "255,255,255, 80"
  # 主图区域颜色
  label_img_color: "255,255,255, 80"
  # 表格相关
  table_widget_info_styles:
    # 表头背景
    header_background_color: "48,77,49"
    # 表头字体
    header_color: "112,63,46"
    # 表格背景
    background_color: "197,190,172"
    # 滑过背景
    item_hover_background_color: "48,77,49"


# AI大模型配置
AI:
  # 当前使用的模型: deepseek, qwen, openai, zhipu, qianfan, doubao, custom
  active_model: 'local'
  # 请求超时（秒）
  timeout: 60
  # 最大生成Token数
  max_tokens: 2000
  # 生成温度（0-1，越低越确定）
  temperature: 0.7
  # 各模型详细配置
  models:
    openai:
      provider: 'openai'
      api_base: 'https://api.openai.com/v1'
      model: 'gpt-3.5-turbo'
      api_key: ''
      secret_key: ''
      verify_ssl: true
    deepseek:
      provider: 'deepseek'
      api_base: 'https://api.deepseek.com/v1'
      model: 'deepseek-chat'
      api_key: ''
      secret_key: ''
      verify_ssl: true
    qwen:
      provider: 'qwen'
      api_base: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
      model: 'qwen-turbo'
      api_key: ''
      secret_key: ''
      verify_ssl: true
    zhipu:
      provider: 'zhipu'
      api_base: 'https://open.bigmodel.cn/api/paas/v4/chat/completions'
      model: 'glm-4-flash'
      api_key: ''
      secret_key: ''
      verify_ssl: true
    qianfan:
      provider: 'qianfan'
      api_base: 'https://aip.baidubce.com'
      model: 'ernie-speed-128k'
      api_key: ''
      secret_key: ''
      verify_ssl: true
    doubao:
      provider: 'doubao'
      api_base: 'https://ark.cn-beijing.volces.com/api/v3'
      model: 'doubao-lite-128k'
      api_key: ''
      secret_key: ''
      verify_ssl: true
    custom:
      provider: 'openai'
      api_base: 'https://your-custom-api.com/v1'
      model: 'your-model'
      api_key: ''
      secret_key: ''
      verify_ssl: true

