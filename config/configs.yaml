# ==================== 摄像头采集（共享单例 + 看门狗自愈） ====================
# 说明：采集由 tool/camera_source.py 统一负责，GUI（main.py）与 API 服务器
# （api_server.py）共用同一套逻辑；多个客户端（手机 + PC）共享同一个采集源，
# 不会再出现"第二个页面打不开相机"，断流 / 黑屏时看门狗会自动重开。
CAMERA:
  # 后端优先级：auto(Windows 优先 DSHOW，失败回退 MSMF/默认) | dshow | msmf
  backend: 'auto'
  # 采集分辨率（0 = 用驱动默认）。MJPG 下 1280x720 一般能到 30fps
  width: 1280
  height: 720
  # 强制 MJPG：很多 USB 摄像头默认 YUY2，帧率被压到 5~10fps
  fourcc: 'MJPG'
  # 超过这么久没有新帧就判"卡死"并换 handle 自愈（秒）
  stale_sec: 2.0
  # 打开设备后等第一帧的最长时间（秒）。
  # ⚠️ 实测数据：2026-10-09 本机 USB 相机索引 1 冷启动 3.0 秒、索引 0 约 2.0 秒；
  #    2026-10-24 用 tool/camera_check.py 复测：**索引 0（外接 vid_0c45）要 7.4 秒**才出图。
  #    所以这个值不能小 —— 调小会把"只是启动慢"的相机误判成"打不开/被占用"。
  #    按标识选中后的重试用更长等待（代码里 _PINNED_FIRST_FRAME_WAIT=12s）。
  probe_timeout: 12.0
  # 推理节奏（fps）：检测频率，越低 GPU 越轻松
  infer_fps: 5
  # 推流节奏（fps）：画面推送频率，与推理解耦，画面更跟手
  stream_fps: 15
  # ---- 桌面 GUI 预览（影响"卡不卡"的关键项）----
  # 预览渲染最高帧率：每帧要做 BGR→RGB + 缩放，纯 CPU 活。
  # 实测 33fps 渲染会把界面拖顿（光帧拷贝就 ~180MB/s）；15 肉眼已流畅。
  display_fps: 15
  # 送进预览窗口的最长边(px)：超过就等比缩小，省 CPU。1280→960 明显更跟手
  display_max_side: 960
  # 手机端实时上传的采样间隔（毫秒）
  phone_frame_interval_ms: 400
  # ---- 历史记录 / 点击回看（GUI 底部表格）----
  # 带框快照存这里，点表格行直接读回显示。
  # ⚠️ 只有"样本"才进这张表：拍照识别、打开图片、打开文件夹。
  #    实时检测只在预览上画框，不写日志（现场评测时 20 个样本必须干净）。
  history_dir: './output/snapshots'
  # 拍照识别后，显示完"拍下的那一张"多久自动回到实时画面（毫秒）。
  # 现场痛点：原来拍完就停在定格画面，必须再点一次「开始运行 >」才能继续看实时，
  # 180 秒拍 20 张根本来不及。设 0 = 结果一回来就立刻恢复实时（完全不定格）。
  snap_resume_ms: 400

# ==================== 现场评测（准确度 + 时效性）====================
# 评分口径（2026-10-11 与用户对齐）：
#   准确度 20 分 = 正确样本数 × points_per_sample（20 个样本 × 1 分）
#   时效性 10 分 = time_full_score - max(0, 用时 - time_limit_sec) × overtime_penalty_per_sec
#   总分   = 准确度 + 时效性（满分 30），扣分扣到 0 为止
# 计时：从"第一张样本记录"自动开始倒计时，满 target_samples 自动停表。
EVAL:
  # 样本数（满分基准）
  target_samples: 20
  # 每正确识别 1 个样本得分 -> 准确度满分 20
  points_per_sample: 1.0
  # 基准时间（秒）
  time_limit_sec: 180
  # 用时 <= time_limit_sec 时的时效满分
  time_full_score: 10.0
  # 每超时 1 秒扣多少分
  overtime_penalty_per_sec: 0.5
  # 关程序时若本轮已有样本且还没导出过，自动导出一份评分报告（防误关丢分）
  auto_export_on_close: true
  # 服务器侧样本目录：Web 测评页 /eval 的「从服务器载入」从这里读图；
  # 目录不存在/为空时页面自动切换为「上传模式」（拖拽文件夹，不依赖服务器文件）
  sample_dir: './pictures20'
  # Web 测评页导出的评分报告目录（GUI 导出去 output/ 根，这里单独建子目录避免混在一起）
  report_dir: './output/eval_reports'

# ==================== 信号反馈配置 ====================
FEEDBACK:
  # 是否启用反馈（语音播报 + 声光报警）
  enabled: true
  # 声光报警器串口号（Windows 如 'COM5'）；无硬件时保持 null，仅用语音播报
  # ESP32 报警板固件: ESP32/src/alarm/main.cpp（烧录 pio run -e alarm -t upload）
  # 烧完后在 VSCode 的 PlatformIO 侧栏看 Ports，或设备管理器里认 CH340/CP2102 的端口
  serial_port: null
  # 串口波特率
  baud: 9600
  # 语音播报最小间隔（秒）：同一状态未变化时的复读间隔
  # （风险等级或害虫种类一变就立刻播报，不受此值限制）
  speak_interval: 3
  # 语音引擎：auto(自动探测) | win32com | pyttsx3 | powershell | none
  #   auto 会按 win32com -> pyttsx3 -> powershell 顺序做"真实出声"校验后选定
  #   （实测本机 SAPI.SPVoice 的 COM 播报报错、System.Speech(powershell) 正常，
  #     auto 能自动选到 powershell —— 现场不用手工改配置）
  tts:
    engine: 'auto'
    rate: 150        # 语速（字/分钟）；150≈SAPI 正常语速，想更慢写 130，别超过 170
    pause_sec: 0.25  # 句与句之间的停顿（秒），让播报有呼吸感
    volume: 1.0      # 音量 0~1
    dedup_sec: 0.5   # 同一句话的去重窗口（秒）
  # "无风险"是否也播报（默认只在从有风险变为无风险时提示一次）
  announce_no_risk: false
  # 启动时念一句自检语音，确认链路活着（日志会打印选中的后端）
  tts_selftest: true

# 喷淋执行配置（ESP-NOW 网关 + 喷头节点，国赛形态C 物理执行闭环）
SPRAY:
  # 是否启用喷淋联动（识别到中/高风险后自动喷淋）
  enabled: true
  # 网关 USB 串口号（Windows 如 'COM4'）；无网关时设为 null，仅推理不做喷淋
  serial_port: null
  # 网关串口波特率（需与 ESP32/src/espnow_gateway/main.cpp 的 Serial.begin 一致）
  baud: 115200
  # 指令传输方式（国赛"田间无线"改造）：
  #   'serial' : Server --USB串口--> 网关ESP32 --ESP-NOW--> 节点（现状，含一根 USB 线）
  #   'http'   : Server --HTTP--> 目标设备（方案甲：节点直连 WiFi；方案丙：无线网关转发）
  #   'mqtt'   : Server --MQTT--> 目标设备（方案乙，需 broker）
  # 本案（国赛方案.md §5）：现场用手机热点，信道不可控 -> 走方案甲 'http' 直连节点
  transport: 'http'
  # transport='http' 时的目标地址表（group -> 设备地址）
  #   方案甲（节点直连，故障隔离好）：每个分组各配一个地址
  #   方案丙（无线网关，节点固件零改动）：只配一项 group='gateway'，全部指令发网关，由网关 ESP-NOW 转发
  # ⚠️ 节点现用 DHCP（`-DUSE_DHCP=1`），IP 由热点/路由器分配，**以节点串口打印的为准**：
  #      串口会打印  WIFI_OK  IP=x.x.x.x   <<< 把这个 IP 填到下面
  #   实测（2026-10-08）：手机热点处于「共享已连接 WiFi」桥接模式时，
  #      地址会由**上游网络**的 DHCP 下发（网段不是你预期的热点网段），
  #      此时写死 192.168.43.61 会「WIFI_OK 但服务器够不着」。
  #   普通手机热点（自带网关、网段固定）节点会自动拿到 192.168.43.x，
  #      也可改回静态：platformio.ini 里把 -DUSE_DHCP=1 改成 0。
  #   ⚠️ 下面的地址是占位示例，请按现场串口打印的 IP 修改后再用。
  #
  # 目标接口协议（每项的 protocol 字段；缺省用上面的 default_protocol）：
  #   'json' : 项目 PlatformIO 固件 ESP32/src/http_node
  #            POST /spray {"group":"g1","duration":2} + POST /stop，按状态码判成败
  #   'mist' : 手写 Arduino sketch（sketch_oct12a.ino，继电器 + 模拟雾化板按键）
  #            GET /start?time=N（定时）/ GET /startDirect（持续，不会自停）/ GET /stop
  #            ⚠️ 该固件没有分组过滤（片区隔离靠 IP 寻址），而且**永远回 200**
  #               —— 连"雾化正在运行中，请先关闭！"也是 200，所以后端读响应体判成败
  http_targets:
    # ⚠️ 现场是**单节点**演示：片区 A/B 只是讲解用的概念，物理上就一个雾化节点。
    #    节点 IP 以它串口打印的 `WiFi成功！IP：x.x.x.x`（115200）为准；
    #    不想改这个文件：/demo → 第二套卡片「节点地址」→ 保存并应用（立即生效、重启也记得）。
    - { group: 'g1', url: 'http://10.130.161.231', protocol: 'mist' }   # 雾化节点（改成实际 IP）
    # 想让"片区B"的按钮/语音也有反应：取消下一行注释，IP 填**同一个**（单节点同时充当两个片区）
    # - { group: 'g2', url: 'http://10.130.161.231', protocol: 'mist' }
  # 用项目固件（http_node）时换成这一版（带 /spray 后缀、json 协议）：
  # http_targets:
  #   - { group: 'g1', url: 'http://192.168.43.61/spray', protocol: 'json' }
  #   - { group: 'g2', url: 'http://192.168.43.62/spray', protocol: 'json' }
  # 方案丙示例（改用 ESP32/src/wifi_gateway 时再换成这一条）：
  # http_targets:
  #   - { group: 'gateway', url: 'http://192.168.43.60/spray', protocol: 'json' }
  http_timeout: 1.0
  # transport='mqtt' 时的 broker 配置
  mqtt:
    host: ''            # 例：'192.168.4.100'
    port: 1883
    topic: 'cropguard/spray'
    qos: 0
  # 两次自动喷淋最小间隔（秒），避免连续推理反复喷；雾化片怕连续通电，可酌情调到 5
  min_interval: 3
  # 风险等级 -> 喷淋分组与时长（秒）映射；duration<=0 或 group 为空表示不喷
  # ⚠️ 负载是 5V 超声雾化片：单次一律 ≤5 秒（固件 -DMAX_SPRAY_SEC=5 会再钳一次）
  # 协议：Server -> 网关串口发 {"group":"all","duration":3}，网关 ESP-NOW 广播，
  #       节点按自身 group 过滤执行（继电器闭合 -> 水泵喷 -> 断开）
  risk_map:
    '高风险': { group: 'all', duration: 3 }
    '中风险': { group: 'g1', duration: 2 }
    # 低风险默认不喷；如需现场演示可改为 { group: 'g2', duration: 1 }
    '低风险': { group: null, duration: 0 }
    '无风险': { group: null, duration: 0 }
  # 喷头节点登记表（烧录时写入节点 NODE_ID/NODE_GROUP；网关可选单播用 MAC）
  # 国赛 2 片区版：片区A = g1(id=1)、片区B = g2(id=2)，每片区 1 个喷洒节点
  # 扩展多节点：按同样格式追加 id/group/name/mac 即可（group 相同的节点会一起被喷）
  nodes:
    - { id: 1, group: 'g1', name: '片区A', mac: 'AA:BB:CC:DD:EE:01' }
    - { id: 2, group: 'g2', name: '片区B', mac: 'AA:BB:CC:DD:EE:02' }
  # 手动/语音指令单次喷淋上限（秒）。雾化片怕连续通电，界面与后端都会钳制
  max_duration: 5
  # http 目标缺省接口协议：'json'（项目固件）| 'mist'（手写 sketch）
  default_protocol: 'json'
  # mist 固件的「持续喷雾」（/startDirect）不会自己停，服务器兜底自动停止秒数；
  # 手机页也会显示这个上限。设 0 或负数 = 不做兜底（只靠人工点停止，不推荐）
  direct_max_sec: 300
  # 探测节点状态页（GET /）的超时（秒）；节点不在线时不该把手机页拖住
  status_timeout: 1.5

# ==================== 本地大模型问答（RAG + 防幻觉） ====================
# 只用本机 Ollama，严禁联网 API（国赛离线合规）。
CHAT:
  enabled: true
  # 携带的历史对话轮数（user+assistant 各算一轮）
  max_history_turns: 6
  # 检索最高分低于此值时拒绝生成（改为"知识库未涵盖"），防止无依据编造
  refuse_below: 0.18
  # 单次问答超时（秒）
  timeout: 120
  # 问答留痕（答辩举证"无依据不生成"）
  log_path: './output/qa_history.jsonl'
  # 固定随机种子：同一问题同一答案，演示可复现
  seed: 20261008

RAG:
  # 召回器：tfidf(内置，零依赖、纯离线) | embedding(预留，需本地 embedding 模型)
  retriever: 'tfidf'
  # 召回条数
  top_k: 4
  # 字符 n-gram 范围（中文用 char_wb 效果稳，不需要分词库）
  char_ngram: [2, 4]

# ==================== EdgeJev 本地类型化决策（离线 CPU 推理） ====================
# 把「一句话 → 结构化决策」（喷洒指令理解 / 虫情处置研判）放到本机 CPU 完成：
# 单题毫秒级、断网可用、运行时不依赖 torch、不上传任何数据。
# 部署（唯一需要联网的一步，在任何一台有网的机器上跑一次即可）：
#   python scripts/build_edge_model.py          # 产出 edge_models/jev-int8（~324MB，自包含）
# 验证：GET /api/edge/status   ·   决策点页：http://<IP>:8080/edge（选择题式，不做自由问答）
EDGE:
  # 总开关（关掉后 /api/edge/* 返回 available=false，/api/ask_command 走回规则解析）
  enabled: true
  # 模型目录（build 产出的自包含目录：model.onnx + tokenizer.json + edgejev.json）
  model_dir: './edge_models/jev-int8'
  # 引擎形态：
  #   auto  = 先试进程内直调（最快），失败再试本地 HTTP 服务
  #   local = 只用进程内直调（需要本目录自带 edgejev 包 + onnxruntime/tokenizers）
  #   http  = 只连 edgejev serve 起的本地服务（独立进程/独立 venv 部署时用）
  # ⚠️ 现场默认 local：没拷模型时**毫秒级**失败并退避，不会在第一条语音指令上
  #    白等 5 秒 HTTP 超时。要用 edgejev serve 独立进程时再改成 auto / http。
  mode: 'local'
  # mode=http 时连的本地服务地址（edgejev serve --model ./edge_models/jev-int8 --port 8009）
  base_url: 'http://127.0.0.1:8009'
  # 服务端设了 --api-key 时在此填同样的 key（本地进程间一般留空）
  api_key: ''
  # 单次决策超时（秒）—— 模型是 15ms 量级，给 5s 已经很宽容
  timeout: 5.0
  # onnxruntime 线程数；0 = 自动（CPU 核数）
  threads: 0
  # /api/ask_command 是否优先用 EdgeJev 做语义解析：
  #   true  = EdgeJev 可用时优先（解析更抗改写），任何失败自动回退规则解析
  #   false = 只用既有规则解析（EdgeJev 仍可通过 /api/edge/parse_command 独立调用）
  # ⚠️ 无论哪条路径，解析结果都必须过同一道安全网关（片区白名单/时长钳制/危险词/人工确认）
  prefer_for_commands: true

# ==================== 手机端 ====================
PHONE:
  # HTTPS 端口（getUserMedia 取手机摄像头必须是安全上下文）
  # 默认启动即同时监听 HTTP(8080) 与 HTTPS(8443)；启动时打印的手机入口为 https。
  # 想只跑 HTTP：python api_server.py --no-https
  https_port: 8443
  cert_dir: './config/certs'
  # 手机实时模式：每隔多久抓一帧上传（毫秒）；越小越流畅、越吃带宽
  frame_interval_ms: 400
  # 手机"实时模式"检测到中/高风险时，是否**自动**联动喷淋。
  #   默认 false：方案二/演示第三套都要求"农户确认后才喷"；
  #   需要自动时在演示指挥台 /demo 里一键打开（不改配置、不重启）。
  live_auto_spray: false
  # 上传帧的最长边（像素），前端压缩后再传
  upload_max_side: 960

